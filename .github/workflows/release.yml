name: Release

# On every push to main:
# - unreleased changesets → open/update the "Version Packages" PR
# - that PR merged (versions bumped, nothing on npm yet) → publish to npm,
#   push per-package git tags and create one GitHub release `v<version>`
#
# Publishing uses npm Trusted Publishing (OIDC): no NPM_TOKEN. Each package
# trusts this workflow file (`release.yml`) on npmjs.com, and provenance is
# attached automatically. Only the `publish` job can mint the OIDC token.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  SAFE_CHAIN_LOGGING: silent

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup monorepo
        uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup monorepo
        uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Open or update the Version Packages PR
        uses: changesets/action/version@v2
        env:
          # @changesets/changelog-github looks up each changeset's PR and
          # author through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: pnpm version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup monorepo
        uses: ./.github/actions/setup
        with:
          cache-key: release
      # `pnpm pack` runs each package's `prepack` (build) and applies
      # publishConfig / workspace:^ rewriting.
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tags and GitHub releases
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup monorepo
        uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Publish packages
        id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          # Per-package git tags are still pushed; the GitHub release is
          # created once per version in the next step instead of per package.
          create-github-releases: false
      # The packages share one version (`fixed`), so one release `v<version>`
      # with every package's notes, built by scripts/release-notes.mjs.
      # Tag `v<version>`, title `<version>` (like React Native's releases).
      - name: Create GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          version=$(node -p 'JSON.parse(process.env.PUBLISHED)[0].version')
          node scripts/release-notes.mjs "$PUBLISHED" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$version" --title "$version" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"
