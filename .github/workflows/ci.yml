name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Report every package's result even when one fails.
      fail-fast: false
      matrix:
        package:
          - core
          - cli
          - chakra-ui
          - material-ui
          - material-design
          - panda-css
          - tailwind-css
          - shadcn-ui
          - radix-ui
        include:
          # Library packages live under packages/react-native-rethemed/.
          - path: packages/react-native-rethemed
          # The shared playground screen used by apps/*.
          - package: example
            path: packages
    env:
      SAFE_CHAIN_LOGGING: silent
    steps:
      - uses: actions/checkout@v4
      - name: Setup monorepo
        uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.package }}
      # Runs every package on every PR (no path filter), so each job always
      # reports a status and can be a required check. A package's tests
      # already cover breakage from upstream packages (e.g. core -> cli ->
      # token package examples), and Turborepo's cache keeps unchanged ones fast.
      - name: Lint
        run: pnpm turbo run lint --filter=./${{ matrix.path }}/${{ matrix.package }}
      - name: Typecheck
        run: pnpm turbo run tsc --filter=./${{ matrix.path }}/${{ matrix.package }}
      - name: Test
        run: pnpm turbo run test:ci --filter=./${{ matrix.path }}/${{ matrix.package }}
      # Library packages only (cli and example have no build script).
      - name: Build
        run: pnpm turbo run build --filter=./${{ matrix.path }}/${{ matrix.package }}

  # Installs the packed tarballs into a React Native app outside the
  # workspace (e2e/package-consumer) and checks Node, types, the CLI, Jest,
  # Metro and Hermes against what npm users get. See docs/testing-packages.md.
  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_LOGGING: silent
      # Our own packages are installed from local tarballs; never let the
      # 48h age check hide their registry metadata.
      SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: '@react-native-rethemed/*'
      SAFE_CHAIN_NPM_MINIMUM_PACKAGE_AGE_EXCLUSIONS: '@react-native-rethemed/*'
    steps:
      - uses: actions/checkout@v4
      - name: Setup monorepo
        uses: ./.github/actions/setup
        with:
          cache-key: package-smoke
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('e2e/package-consumer/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Package smoke test
        run: pnpm smoke
