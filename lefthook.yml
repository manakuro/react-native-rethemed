pre-commit:
  parallel: true
  commands:
    core/lint:
      tags: core
      root: packages/react-native-rethemed/core/
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      stage_fixed: true
      run: |
        npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    core/tsc:
      tags: core
      root: packages/react-native-rethemed/core/
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    cli/lint:
      tags: cli
      root: packages/react-native-rethemed/cli/
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
