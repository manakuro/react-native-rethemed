packages:
  - apps/*
  - packages/*
  - packages/react-native-rethemed/*

catalog:
  react-native: 0.86.2
  react: 19.2.3
  react-dom: 19.2.3

packageExtensions:
  # The preset resolves `react-native` from its own location but doesn't
  # declare it, so it would get whichever copy pnpm hoists (one of the apps').
  # As a peer, each app's copy is linked next to it.
  '@react-native/jest-preset':
    peerDependencies:
      react-native: '*'

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver
